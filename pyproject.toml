[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netprobe"]

[tool.hatch.build.targets.sdist]
include = ["/src/netprobe"]

[project]
name = "py-netprobe"
version = "0.1.0"
description = "Single-command network diagnostic engine in Python testing DNS -> TCP -> TLS -> HTTP with latency waterfall and diagnostic exceptions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Juan Castin", email = "juancastingo@users.noreply.github.com" },
]
keywords = [
    "network",
    "diagnostics",
    "dns",
    "tcp",
    "tls",
    "ssl",
    "http",
    "latency",
    "asyncio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
netprobe = "netprobe.cli:main"

[project.urls]
Homepage = "https://github.com/juancastingo/py-netprobe"
Repository = "https://github.com/juancastingo/py-netprobe"
Issues = "https://github.com/juancastingo/py-netprobe/issues"
